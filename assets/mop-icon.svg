  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <path d="M0 228A228 228 0 0 1 228 0h568a228 228 0 0 1 228 228v250C760 430 300 404 0 540z" fill="url(#gloss)"/>

