<title>machine-ops console</title>
<style>
:root{
  --bg:#ececed; --panel:#fff; --panel-2:#f7f7f8; --side:#f2f2f3;
  --line:#dededf; --line-soft:#eaeaeb;
  --ink:#1d1d20; --ink-2:#5c5c63; --ink-3:#8a8a92;
  --accent:#0a6cff; --accent-ink:#fff; --accent-soft:rgba(10,108,255,.10);
  --quiet:#17865a; --quiet-bg:rgba(23,134,90,.11);
  --spoke:#ab6100; --spoke-bg:rgba(201,120,0,.13);
  --fail:#c9282d; --fail-bg:rgba(201,40,45,.11);
  --hang:#7b3fb5; --hang-bg:rgba(123,63,181,.12);
  --off:#76767e; --off-bg:rgba(118,118,126,.12);
  --shadow-1:0 .5px 1px rgba(0,0,0,.09),0 1px 2px rgba(0,0,0,.05);
  --shadow-2:0 .5px 1px rgba(0,0,0,.08),0 2px 5px rgba(0,0,0,.07),0 8px 20px rgba(0,0,0,.06);
  --shadow-win:0 0 0 .5px rgba(0,0,0,.14),0 12px 34px rgba(0,0,0,.17);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r-win:11px; --r-panel:10px; --r-card:8px; --r-ctl:6px;
}
:root:not([data-theme=light]){ @media (prefers-color-scheme:dark){
  --bg:#141416; --panel:#1e1e21; --panel-2:#26262a; --side:#191a1c;
  --line:#33333a; --line-soft:#2a2a2f;
  --ink:#f2f2f5; --ink-2:#a8a8b2; --ink-3:#74747e;
  --accent:#3b8bff; --accent-soft:rgba(59,139,255,.16);
  --quiet:#43c08a; --quiet-bg:rgba(67,192,138,.14);
  --spoke:#e5a33c; --spoke-bg:rgba(229,163,60,.15);
  --fail:#ff6b6f; --fail-bg:rgba(255,107,111,.14);
  --hang:#b98cf0; --hang-bg:rgba(185,140,240,.15);
  --off:#8b8b95; --off-bg:rgba(139,139,149,.14);
  --shadow-1:0 .5px 1px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --shadow-win:0 0 0 .5px rgba(255,255,255,.09),0 14px 40px rgba(0,0,0,.6);
}}
:root[data-theme=dark]{
  --bg:#141416; --panel:#1e1e21; --panel-2:#26262a; --side:#191a1c;
  --line:#33333a; --line-soft:#2a2a2f;
  --ink:#f2f2f5; --ink-2:#a8a8b2; --ink-3:#74747e;
  --accent:#3b8bff; --accent-soft:rgba(59,139,255,.16);
  --quiet:#43c08a; --quiet-bg:rgba(67,192,138,.14);
  --spoke:#e5a33c; --spoke-bg:rgba(229,163,60,.15);
  --fail:#ff6b6f; --fail-bg:rgba(255,107,111,.14);
  --hang:#b98cf0; --hang-bg:rgba(185,140,240,.15);
  --off:#8b8b95; --off-bg:rgba(139,139,149,.14);
  --shadow-1:0 .5px 1px rgba(0,0,0,.4);
  --shadow-2:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.45);
  --shadow-win:0 0 0 .5px rgba(255,255,255,.09),0 14px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
  padding:22px 16px;padding-block:22px;
}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty}
.mono{font-family:var(--mono)}

/* ---------- window chrome ---------- */
.win{max-width:1180px;margin:0 auto;background:var(--panel);border-radius:var(--r-win);
  box-shadow:var(--shadow-win);overflow:hidden;display:flex;flex-direction:column;min-height:min(840px,88vh)}
.titlebar{display:flex;align-items:center;gap:12px;height:46px;padding:0 13px;
  border-bottom:.5px solid var(--line);background:var(--side);flex:0 0 auto}
.lights{display:flex;gap:8px;flex:0 0 auto}
.lights i{width:12px;height:12px;border-radius:50%;display:block;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
.tb-title{font-weight:600;font-size:13px;letter-spacing:-.01em}
.tb-title span{color:var(--ink-3);font-weight:400}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}

/* ---------- shell ---------- */
.shell{display:flex;flex:1 1 auto;min-height:0}
.sidebar{width:216px;flex:0 0 216px;background:var(--side);border-right:.5px solid var(--line);
  padding:10px 9px;overflow-y:auto}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;
  color:var(--ink-3);padding:10px 8px 5px}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:0 8px;
  border:0;background:none;color:var(--ink);font:inherit;text-align:left;
  border-radius:var(--r-ctl);cursor:pointer;
  transition-property:background-color,color;transition-duration:120ms}
.nav-item:hover{background:rgba(127,127,135,.13)}
.nav-item[aria-current=true]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.nav-item[aria-current=true] .ic{color:var(--accent-ink)}
.nav-item .ic{color:var(--ink-2);flex:0 0 auto}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500}
.nav-item[aria-current=true] .cnt{color:rgba(255,255,255,.75)}
.sb-job{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;padding:0 8px;border:0;
  background:none;color:var(--ink);font:inherit;text-align:left;border-radius:var(--r-ctl);cursor:pointer;
  transition-property:background-color;transition-duration:120ms}
.sb-job:hover{background:rgba(127,127,135,.13)}
.sb-job.sel{background:rgba(127,127,135,.18)}
.sb-job .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.sb-job.dis .nm{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--ink-3)}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.toolbar{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:.5px solid var(--line);
  flex:0 0 auto;background:var(--panel)}
.toolbar h2{font-size:14.5px;font-weight:600;letter-spacing:-.012em}
.toolbar .sub{color:var(--ink-3);font-size:12px}
.spacer{margin-left:auto}
.scroll{flex:1 1 auto;overflow-y:auto;padding:16px;min-height:0}

/* ---------- dots & badges ---------- */
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:block;
  box-shadow:0 0 0 2.5px var(--ring,transparent)}
.dot.quiet{background:var(--quiet);--ring:var(--quiet-bg)}
.dot.spoke{background:var(--spoke);--ring:var(--spoke-bg)}
.dot.fail{background:var(--fail);--ring:var(--fail-bg)}
.dot.hang{background:var(--hang);--ring:var(--hang-bg)}
.dot.off{background:var(--off);--ring:var(--off-bg)}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;
  font-size:11px;font-weight:600;letter-spacing:.005em;white-space:nowrap}
.badge.quiet{color:var(--quiet);background:var(--quiet-bg)}
.badge.spoke{color:var(--spoke);background:var(--spoke-bg)}
.badge.fail{color:var(--fail);background:var(--fail-bg)}
.badge.hang{color:var(--hang);background:var(--hang-bg)}
.badge.off{color:var(--off);background:var(--off-bg)}
.badge.tier{color:var(--ink-2);background:rgba(127,127,135,.13);font-weight:500;font-family:var(--mono);font-size:10.5px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:26px;
  padding:0 10px;border-radius:var(--r-ctl);border:.5px solid var(--line);background:var(--panel);
  color:var(--ink);font:inherit;font-size:12.5px;font-weight:500;cursor:pointer;
  box-shadow:var(--shadow-1);
  transition-property:background-color,scale,border-color,color;transition-duration:110ms;
  transition-timing-function:cubic-bezier(.2,0,0,1)}
.btn:hover{background:var(--panel-2)}
.btn:active{scale:.96}
.btn.pri{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--fail);border-color:var(--line)}
.btn.danger:hover{background:var(--fail-bg)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:rgba(127,127,135,.14);color:var(--ink)}
.btn.sm{min-height:22px;padding:0 7px;font-size:11.5px}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;
  border:0;background:none;border-radius:var(--r-ctl);color:var(--ink-2);cursor:pointer;position:relative;
  transition-property:background-color,color,scale;transition-duration:110ms}
.ibtn::after{content:"";position:absolute;inset:-6px}
.ibtn:hover{background:rgba(127,127,135,.14);color:var(--ink)}
.ibtn:active{scale:.96}

/* switch */
.sw{appearance:none;width:34px;height:20px;border-radius:10px;background:rgba(127,127,135,.32);
  position:relative;cursor:pointer;flex:0 0 auto;border:0;margin:0;
  transition-property:background-color;transition-duration:160ms;transition-timing-function:cubic-bezier(.2,0,0,1)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);
  transition-property:translate;transition-duration:160ms;transition-timing-function:cubic-bezier(.2,0,0,1)}
.sw:checked{background:var(--quiet)}
.sw:checked::after{translate:14px 0}
.sw:active::after{scale:.94}

/* ---------- cards / panels ---------- */
.card{background:var(--panel);border:.5px solid var(--line);border-radius:var(--r-panel);
  box-shadow:var(--shadow-1)}
.card.pad{padding:13px}
.grid{display:grid;gap:11px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:9px}
.col{display:flex;flex-direction:column}
.sec-h{display:flex;align-items:center;gap:8px;margin:20px 2px 9px}
.sec-h:first-child{margin-top:2px}
.sec-h h3{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.sec-h .ln{flex:1 1 auto;height:.5px;background:var(--line-soft)}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-2)}
.num{font-size:23px;font-weight:600;letter-spacing:-.022em;line-height:1.15}
.lbl{font-size:11px;color:var(--ink-3);font-weight:500}

/* banner */
.banner{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--r-panel);
  border:.5px solid var(--line)}
.banner.ok{background:var(--quiet-bg);border-color:transparent}
.banner.warn{background:var(--spoke-bg);border-color:transparent}
.banner .ttl{font-size:14px;font-weight:600;letter-spacing:-.01em}
.banner .ttl.ok{color:var(--quiet)}.banner .ttl.warn{color:var(--spoke)}
.banner .ds{font-size:12px;color:var(--ink-2)}

/* heat strip */
.heat{display:flex;gap:2.5px}
.heat i{width:9px;height:17px;border-radius:2.5px;background:var(--quiet-bg);display:block;
  transition-property:scale;transition-duration:110ms}
.heat i:hover{scale:1.22}
.heat i.quiet{background:var(--quiet);opacity:.85}
.heat i.spoke{background:var(--spoke)}
.heat i.fail{background:var(--fail)}
.heat i.hang{background:var(--hang)}
.heat i.none{background:rgba(127,127,135,.17)}

/* job table */
.jt{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.jt th{text-align:left;font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.03em;
  text-transform:uppercase;padding:0 10px 7px;white-space:nowrap}
.jt td{padding:9px 10px;border-top:.5px solid var(--line-soft);vertical-align:middle}
.jt tbody tr{cursor:pointer;transition-property:background-color;transition-duration:100ms}
.jt tbody tr:hover{background:var(--panel-2)}
.jt tbody tr.sel{background:var(--accent-soft)}
.jt .nm{font-weight:500;display:flex;align-items:center;gap:8px}
.jt .nm code{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.tbl-wrap{overflow-x:auto;border:.5px solid var(--line);border-radius:var(--r-panel);padding:11px;
  background:var(--panel);box-shadow:var(--shadow-1)}

/* 24h ribbon */
.ribbon{position:relative;padding:22px 0 4px;margin:0 4px}
.rb-track{position:relative;height:30px;background:var(--panel-2);border-radius:var(--r-card);
  border:.5px solid var(--line-soft)}
.rb-track+.rb-track{margin-top:7px}
.rb-ticks{position:relative;height:16px;margin:0 0 5px}
.rb-ticks span{position:absolute;top:0;font-size:10px;color:var(--ink-3);translate:-50% 0;font-weight:500}
.rb-grid{position:absolute;inset:0;pointer-events:none}
.rb-grid i{position:absolute;top:0;bottom:0;width:.5px;background:var(--line-soft)}
.rb-blk{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--accent);
  color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 3px;
  min-width:40px;overflow:hidden;white-space:nowrap;cursor:grab;
  box-shadow:0 1px 3px rgba(0,0,0,.22);
  transition-property:scale,filter;transition-duration:110ms}
.rb-blk:hover{filter:brightness(1.1);scale:1.02}
.rb-blk.b2{background:#7b3fb5}.rb-blk.b3{background:#17865a}.rb-blk.b4{background:#ab6100}
.rb-lane{display:flex;align-items:center;gap:9px}
.rb-name{width:132px;flex:0 0 132px;font-size:12px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rb-wrap{flex:1 1 auto;min-width:0}
.rb-now{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--fail);z-index:3}
.rb-now::before{content:"";position:absolute;top:-3px;left:-2.5px;width:6.5px;height:6.5px;
  border-radius:50%;background:var(--fail)}
.rb-lane:not(:nth-child(2)) .rb-now::before{display:none}
.rb-lane:not(:nth-child(2)) .rb-now{opacity:.45}

/* log viewer */
.logbar{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:.5px solid var(--line);
  background:var(--panel-2);flex-wrap:wrap}
.inp{height:26px;padding:0 9px;border-radius:var(--r-ctl);border:.5px solid var(--line);
  background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;min-width:0;
  transition-property:border-color,box-shadow;transition-duration:110ms}
.inp:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{cursor:pointer;padding-right:5px}
.seg{display:inline-flex;background:rgba(127,127,135,.14);border-radius:7px;padding:2px;gap:2px}
.seg button{min-height:22px;padding:0 9px;border:0;background:none;border-radius:5px;font:inherit;
  font-size:11.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
  transition-property:background-color,color;transition-duration:110ms}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-1)}
.loglist{font-family:var(--mono);font-size:11.5px;line-height:1.62;padding:4px 0}
.lg{display:flex;gap:10px;padding:1.5px 12px;border-left:2px solid transparent}
.lg:hover{background:var(--panel-2)}
.lg .t{color:var(--ink-3);flex:0 0 auto;font-size:11px}
.lg .s{color:var(--ink-2);flex:0 0 auto;min-width:108px}
.lg .m{color:var(--ink);overflow-wrap:anywhere}
.lg.alert{border-left-color:var(--spoke);background:var(--spoke-bg)}
.lg.alert .m{color:var(--spoke);font-weight:500}
.lg.err{border-left-color:var(--fail);background:var(--fail-bg)}
.lg.err .m{color:var(--fail);font-weight:500}
.lg.head{border-left-color:var(--accent);background:var(--accent-soft);margin-top:5px}
.lg.head .m{font-weight:600}
.runsep{display:flex;align-items:center;gap:9px;padding:9px 12px 5px;font-size:11px;
  color:var(--ink-3);font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-family:inherit}
.runsep .ln{flex:1;height:.5px;background:var(--line-soft)}

/* detail drawer */
.kv{display:grid;grid-template-columns:118px 1fr;gap:7px 12px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--ink-3);font-size:11.5px}
.kv dd{margin:0;overflow-wrap:anywhere}
.src{font-family:var(--mono);font-size:11.5px;line-height:1.6;background:var(--panel-2);
  border:.5px solid var(--line);border-radius:var(--r-card);padding:11px;overflow-x:auto;
  color:var(--ink-2);white-space:pre;margin:0}
.src b{color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;
  background:rgba(127,127,135,.14);font-size:11.5px;font-weight:500;color:var(--ink-2)}
.pill .x{cursor:pointer;color:var(--ink-3);font-size:13px;line-height:1}
.pill .x:hover{color:var(--fail)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.34);backdrop-filter:blur(2px);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:22px}
.modal{width:min(620px,100%);max-height:86vh;overflow-y:auto;background:var(--panel);
  border-radius:12px;box-shadow:var(--shadow-2),0 0 0 .5px var(--line);padding:19px}
.modal h3{font-size:16px;font-weight:600;letter-spacing:-.015em;margin-bottom:4px}
.tpl{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:11px;
  border-radius:var(--r-card);border:.5px solid var(--line);background:var(--panel);cursor:pointer;
  font:inherit;color:var(--ink);
  transition-property:border-color,background-color,scale;transition-duration:110ms}
.tpl:hover{background:var(--panel-2)}
.tpl:active{scale:.985}
.tpl[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.tpl .ti{width:30px;height:30px;flex:0 0 auto;border-radius:7px;background:rgba(127,127,135,.15);
  display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.tpl[aria-pressed=true] .ti{background:var(--accent);color:#fff}
.tpl .tt{font-weight:600;font-size:13px}
.tpl .td{font-size:11.5px;color:var(--ink-3);text-wrap:pretty}
.field{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.field label{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11px;color:var(--ink-3);text-wrap:pretty}
.note{display:flex;gap:9px;padding:10px 11px;border-radius:var(--r-card);background:var(--accent-soft);
  font-size:11.5px;color:var(--ink-2);text-wrap:pretty}
.note b{color:var(--ink)}
.statusbar{display:flex;align-items:center;gap:10px;padding:0 13px;height:27px;flex:0 0 auto;
  border-top:.5px solid var(--line);background:var(--side);font-size:11px;color:var(--ink-3)}
@media(max-width:860px){
  .shell{flex-direction:column}
  .sidebar{width:auto;flex:0 0 auto;border-right:0;border-bottom:.5px solid var(--line)}
  .g4,.g2{grid-template-columns:minmax(0,1fr)}
  .rb-name{width:98px;flex-basis:98px}
}
</style>
<style>
/* ---------- scale components ---------- */
.grp{margin-top:2px}
.grp-h{display:flex;align-items:center;gap:7px;width:100%;min-height:28px;padding:0 8px;border:0;
  background:none;color:var(--ink-2);font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;
  border-radius:var(--r-ctl);text-align:left;
  transition-property:background-color,color;transition-duration:120ms}
.grp-h:hover{background:rgba(127,127,135,.12);color:var(--ink)}
.grp-h .chev{transition-property:rotate;transition-duration:160ms;
  transition-timing-function:cubic-bezier(.2,0,0,1);color:var(--ink-3)}
.grp-h[aria-expanded=false] .chev{rotate:-90deg}
.grp-h .cnt{margin-left:auto;font-size:10.5px;color:var(--ink-3);font-weight:600}
.grp-body{overflow:hidden}
.sb-job{padding-left:22px}

/* segmented status bar */
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(127,127,135,.16)}
.sbar i{display:block;height:100%}
.sbar i.quiet{background:var(--quiet)}.sbar i.spoke{background:var(--spoke)}
.sbar i.fail{background:var(--fail)}.sbar i.hang{background:var(--hang)}
.sbar i.off{background:var(--off);opacity:.55}.sbar i.none{background:rgba(127,127,135,.3)}

/* filter chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:13px;
  border:.5px solid var(--line);background:var(--panel);color:var(--ink-2);font:inherit;font-size:12px;
  font-weight:500;cursor:pointer;
  transition-property:background-color,color,border-color,scale;transition-duration:110ms}
.chip:hover{background:var(--panel-2);color:var(--ink)}
.chip:active{scale:.96}
.chip[aria-pressed=true]{background:var(--accent);border-color:transparent;color:#fff}
.chip[aria-pressed=true] .dot{box-shadow:none}
.chip .n{font-variant-numeric:tabular-nums;opacity:.75}

/* bulk action bar */
.bulk{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;padding:9px 12px;
  border-radius:var(--r-panel);background:var(--accent);color:#fff;box-shadow:var(--shadow-2);
  margin-bottom:11px}
.bulk .btn{background:rgba(255,255,255,.17);border-color:transparent;color:#fff;box-shadow:none}
.bulk .btn:hover{background:rgba(255,255,255,.27)}

/* fleet heatmap */
.fleet{display:grid;gap:7px}
.fleet-row{display:grid;grid-template-columns:148px 1fr;align-items:center;gap:10px}
.fleet-name{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.fleet-cells{display:flex;gap:2px}
.fleet-cells i{flex:1 1 0;min-width:0;height:13px;border-radius:2px;background:rgba(127,127,135,.17);
  transition-property:scale;transition-duration:110ms}
.fleet-cells i:hover{scale:1.5}
.fleet-cells i.quiet{background:var(--quiet);opacity:.82}
.fleet-cells i.spoke{background:var(--spoke)}.fleet-cells i.fail{background:var(--fail)}
.fleet-cells i.hang{background:var(--hang)}.fleet-cells i.off{background:rgba(127,127,135,.26)}

/* load histogram */
.histo{display:flex;align-items:flex-end;gap:1px;height:92px;padding:0 1px}
.histo i{flex:1 1 0;min-width:0;background:var(--accent);border-radius:2px 2px 0 0;opacity:.75;
  transition-property:opacity,scale;transition-duration:110ms;min-height:2px}
.histo i:hover{opacity:1}
.histo i.hot{background:var(--spoke);opacity:.95}
.histo i.crit{background:var(--fail);opacity:1}
.histo-ax{display:flex;margin-top:5px;font-size:10px;color:var(--ink-3);font-weight:500}
.histo-ax span{flex:1 1 0;text-align:left}

/* command palette */
.pal{width:min(600px,100%);background:var(--panel);border-radius:12px;overflow:hidden;
  box-shadow:var(--shadow-2),0 0 0 .5px var(--line);margin-top:9vh;align-self:flex-start}
.pal input{width:100%;height:48px;padding:0 16px;border:0;border-bottom:.5px solid var(--line);
  background:none;color:var(--ink);font:inherit;font-size:15px}
.pal input:focus{outline:0}
.pal-list{max-height:52vh;overflow-y:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:9px;width:100%;min-height:36px;padding:0 10px;border:0;
  background:none;border-radius:var(--r-ctl);color:var(--ink);font:inherit;font-size:13px;text-align:left;
  cursor:pointer;transition-property:background-color;transition-duration:90ms}
.pal-item:hover,.pal-item.on{background:var(--accent-soft)}
.pal-item .g{margin-left:auto;font-size:11px;color:var(--ink-3)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;
  border-radius:4px;background:rgba(127,127,135,.17);font-size:10.5px;font-weight:600;color:var(--ink-3);
  font-family:var(--mono)}

/* compact table additions */
.jt td.c{padding:6px 10px}
.jt .mini{font-size:11px;color:var(--ink-3)}
.jt tbody tr.pick{background:var(--accent-soft)}
.gh-row td{background:var(--panel-2);font-size:11px;font-weight:600;letter-spacing:.04em;
  text-transform:uppercase;color:var(--ink-3);padding:6px 10px}
.empty{display:flex;flex-direction:column;align-items:center;gap:7px;padding:44px 16px;text-align:center}
.empty .t{font-weight:600;font-size:13.5px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    if (d <= NOW) continue;
    if (s.mode === 'weekly' && !s.days.includes(DAYS[(d.getDay()+6)%7])) continue;
    cand.push(d);
  }
  return cand.sort((a,b)=>a-b)[0] ?? null;
}
const untilStr = d => {
  if (!d) return '—';
  const mins = Math.round((d - NOW)/60000), h = Math.floor(mins/60);
  return h >= 24 ? `in ${Math.floor(h/24)}d ${h%24}h` : h ? `in ${h}h ${mins%60}m` : `in ${mins}m`;
};
const schedText = j => {
  const s = j.schedule;
  if (s.mode === 'interval') return `Every ${s.everyHours}h`;
  if (s.mode === 'weekly') return `${s.days.join(', ')} ${s.times.join(', ')}`;
  return `Daily ${s.times.join(', ')}`;
};
const counts = list => list.reduce((a, j) => {
  const k = j.enabled ? j.last.status : 'off'; a[k] = (a[k]||0)+1; return a; }, {});
const sbar = list => {

};

/* ============ view: schedule (load, not lanes) ============ */
function startsOf(j) {
  if (!j.enabled) return [];
  if (j.schedule.mode === 'interval') {
    const out = []; for (let h = 0; h < 24; h += j.schedule.everyHours) out.push(h*60); return out;
  }
  return j.schedule.times.map(t => { const [hh,mm] = t.split(':').map(Number); return hh*60+mm; });
}
function loadProfile() {
  const mins = new Array(1440).fill(0);
  for (const j of JOBS) for (const s of startsOf(j)) {
    const len = Math.max(1, Math.round(j.last.dur/60));
    for (let i = 0; i < len; i++) mins[(s+i)%1440]++;
  }
  return mins;
}
function vSchedule() {
  const mins = loadProfile();
  const B = 48, bw = 1440/B;                       // 30-minute buckets
  const buckets = Array.from({length:B}, (_,b) => Math.max(...mins.slice(b*bw,(b+1)*bw)));
  const peak = Math.max(...buckets, 1);
  const peakMin = mins.indexOf(Math.max(...mins));
  const hot = buckets.map((v,b)=>[b,v]).filter(([,v])=>v>=3);
  const hhmm = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
  const busiest = GROUPS.map(([k,label]) => {
    const list = JOBS.filter(j=>j.group===k&&j.enabled);
    return [label, list.reduce((a,j)=>a+j.last.dur,0), list.length];
  }).sort((a,b)=>b[1]-a[1]);

  return `
  <div class="grid g4">
    ${[['Peak concurrency', Math.max(...mins), `at ${hhmm(peakMin)}`],
       ['Busiest window', hhmm(Math.floor(peakMin/30)*30), `${hot.length} windows ≥3 jobs`],
       ['Scheduled starts', JOBS.filter(j=>j.enabled).reduce((a,j)=>a+startsOf(j).length,0), 'per day'],
       ['Longest job', fmtDur(Math.max(...JOBS.map(j=>j.last.dur))), 'restic integrity']
      ].map(([l,v,s])=>`<div class="card pad col" style="gap:3px">
        <div class="lbl">${l}</div><div class="num">${v}</div>
        <div class="muted" style="font-size:11px">${s}</div></div>`).join('')}
  </div>

  <div class="sec-h"><h3>Load across the day</h3><span class="ln"></span>
    <span class="muted" style="font-size:11px">concurrent automations · 30-min buckets</span></div>
  <div class="card pad">
    <div class="histo">
      ${buckets.map((v,b)=>`<i class="${v>=5?'crit':v>=3?'hot':''}"
        style="height:${Math.max(2, v/peak*100)}%"
        title="${hhmm(b*bw)}–${hhmm((b+1)*bw-1)} — ${v} concurrent"></i>`).join('')}
    </div>
    <div class="histo-ax">${Array.from({length:8},(_,i)=>`<span>${String(i*3).padStart(2,'0')}:00</span>`).join('')}</div>
    <div class="row" style="gap:14px;margin-top:11px;font-size:11px" class="muted">
      <span class="row muted" style="gap:6px"><i style="width:9px;height:9px;border-radius:2px;background:var(--accent);opacity:.75"></i>1–2 concurrent</span>
      <span class="row muted" style="gap:6px"><i style="width:9px;height:9px;border-radius:2px;background:var(--spoke)"></i>3–4</span>
      <span class="row muted" style="gap:6px"><i style="width:9px;height:9px;border-radius:2px;background:var(--fail)"></i>5+</span>
    </div>
  </div>

  ${hot.length ? `
  <div class="sec-h"><h3>Contended windows</h3><span class="ln"></span>
    <button class="btn sm pri" data-bulk="stagger">${IC.stagger} Auto-stagger all</button></div>
  <div class="card" style="overflow:hidden">
    ${hot.slice(0,6).map(([b,v],i)=>{
      const from = b*bw, to = (b+1)*bw;
      const overlap = JOBS.filter(j=>j.enabled&&startsOf(j).some(s=>s>=from-60&&s<to));
      return `<div class="row" style="padding:10px 13px;${i?'border-top:.5px solid var(--line-soft)':''}">
        <span class="badge ${v>=5?'fail':'spoke'}">${v} at once</span>
        <span class="mono" style="font-size:12px">${hhmm(from)}–${hhmm(to-1)}</span>
        <span class="muted trunc" style="font-size:11.5px;min-width:0">${
          overlap.slice(0,4).map(j=>esc(j.title)).join(', ')}${overlap.length>4?` +${overlap.length-4}`:''}</span>
        <button class="btn sm ghost" style="margin-left:auto">Restage</button>
      </div>`;
    }).join('')}
  </div>
  <div class="note" style="margin-top:11px">
    <span style="color:var(--accent);flex:0 0 auto">${IC.warn}</span>
    <div><b>Why this matters at ${JOBS.length} automations.</b> Each job holds its own timeout window, and
    <span class="mono">bin/run</span> walks the tier sequentially — so a crowded 02:00 turns a
    2-minute sweep into an hour, and one hung job blocks every job behind it. Auto-stagger spreads
    the selected automations across a window you choose, longest first.</div>
  </div>` : ''}

  <div class="sec-h"><h3>Runtime by group</h3><span class="ln"></span></div>
  <div class="card pad col" style="gap:11px">
    ${busiest.map(([label,sec,n])=>`
      <div class="row" style="gap:11px">
        <span style="width:146px;flex:0 0 146px;font-size:12px" class="trunc">${label}</span>
        <div style="flex:1 1 auto;min-width:0"><div class="sbar" style="height:9px">
          <i class="quiet" style="width:${sec/busiest[0][1]*100}%"></i></div></div>
        <span class="mono" style="font-size:11.5px;min-width:72px;text-align:right">${fmtDur(sec)}</span>
        <span class="muted" style="font-size:11px;min-width:30px;text-align:right">${n}</span>
      </div>`).join('')}
  </div>`;
}

function vLogs() {
  let rows = LOG;
  if (logFilter !== 'all') rows = rows.filter(l => logFilter === 'alerts'
    ? (l.sev === 'alert' || l.sev === 'err') : l.src === logFilter || l.src.startsWith(logFilter));
  if (logQuery) rows = rows.filter(l => (l.msg+l.src).toLowerCase().includes(logQuery.toLowerCase()));
  const speaking = JOBS.filter(j=>j.enabled&&ATTN.includes(j.last.status));

  return `
  <div class="card" style="overflow:hidden;padding:0">
    <div class="logbar">
      <input class="inp" id="log-q" placeholder="Filter log…" value="${esc(logQuery)}" style="width:180px">
      <select class="inp" id="log-src">
        <option value="all"${logFilter==='all'?' selected':''}>All ${JOBS.length} sources</option>
        <option value="alerts"${logFilter==='alerts'?' selected':''}>Alerts only</option>
        ${GROUPS.map(([k,label])=>`<optgroup label="${label}">${
          JOBS.filter(j=>j.group===k).map(j=>
            `<option value="${j.label}"${logFilter===j.label?' selected':''}>${esc(j.title)}</option>`).join('')
        }</optgroup>`).join('')}
      </select>
      <div class="seg">
        <button aria-pressed="${logGroup}" id="log-group">By sweep</button>
        <button aria-pressed="${!logGroup}" id="log-flat">Flat</button>
      </div>
      <span class="muted" style="font-size:11px;margin-left:auto">${rows.length} lines · per-job files in
        logs/job-&lt;slug&gt;.out.log</span>
      <button class="btn sm ghost">${IC.refresh} Tail</button>
    </div>
    <div class="loglist">
      ${logGroup?`<div class="runsep"><span class="dot spoke"></span>Sweep 2026-10-20<span class="ln"></span>
        <span style="text-transform:none;letter-spacing:0">${speaking.length} jobs spoke of ${JOBS.filter(j=>j.enabled).length}</span></div>`:''}
      ${rows.map(l=>`<div class="lg ${l.sev}"><span class="t">${l.time}</span>
        <span class="s">${esc(l.src)}</span><span class="m">${esc(l.msg)}</span></div>`).join('')
        || '<div class="lg"><span class="m muted">No matching lines.</span></div>'}
    </div>
  </div>
  <div class="note" style="margin-top:12px">
    <span style="color:var(--spoke);flex:0 0 auto">${IC.warn}</span>
    <div><b>One 5 MB log will not survive ${JOBS.length} automations.</b> At this size each automation writes its own
    <span class="mono">logs/job-&lt;slug&gt;.out.log</span> and the shared
    <span class="mono">machine-ops.log</span> keeps only the one-line-per-run summaries — otherwise a single
    chatty job rotates away everyone else's history.</div>
  </div>`;
}

/* ============ mole privilege facts (verified against mole 1.54.0 source) ============ */
const PRIV = {
  'mole-optimize': { state:'full', gate:'sudo -n true', ok:true,
    needs:['/usr/bin/sfltool dumpbtm','/usr/bin/true'],
    note:'Every privileged command optimize invokes is pinned in /etc/sudoers.d/mole, so all subtasks run unattended.' },
  'mole-clean': { state:'user', gate:'sudo -n -v', ok:false, deep:true,
    needs:['/bin/rm -rf <any path>','/usr/bin/find <any args>'],
    note:'The system pass needs root rm/find with unrestricted arguments — sudo find … -exec is arbitrary root execution, so granting it equals NOPASSWD: ALL. It stays user-level at 02:00 by design; run Deep clean to include it.' },
};

/* ============ render ============ */
const TITLES = {
  overview:['Overview','exceptions first — quiet automations stay out of the way'],
  jobs:['Automations','search, filter, group and act in bulk'],
  schedule:['Schedule','where the load actually lands across the day'],
  logs:['Logs','per-job files plus the shared summary log'],
  settings:['Settings','scale, privileges and safety rails'],
  detail:['Automation','configuration, history and log'],
};
function render() {
  renderChrome();
  const [t, s] = TITLES[view] || TITLES.overview;
  $('#toolbar').innerHTML = `<h2>${t}</h2><span class="sub">${s}</span><div class="spacer"></div>
    ${view==='jobs'?`<button class="btn pri" id="btn-add2">${IC.plus} New automation</button>`:''}
    ${view==='schedule'?`<button class="btn" data-bulk="stagger">${IC.stagger} Auto-stagger</button>`:''}`;
  $('#view').innerHTML = ({overview:vOverview, jobs:vJobs, schedule:vSchedule,
    logs:vLogs, settings:vSettings, detail:vDetail}[view] || vOverview)();
}

/* ============ events ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-job],[data-open],[data-run],[data-dry],[data-del],[data-deep],[data-view],[data-grp],[data-grpopen],[data-status],[data-groupby],[data-bulk],[data-mode],[data-clearf],[data-close],[data-confirmdel],#btn-add,#btn-add2,#btn-theme,#btn-pal,#log-group,#log-flat');
  if (!t) return;
  const d = t.dataset;

  if (t.id === 'btn-theme') {
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
    return renderChrome();
  }
  if (t.id === 'btn-pal') { palOpen = true; palQ = ''; return renderPalette(); }
  if (t.id === 'btn-add' || t.id === 'btn-add2') { layer.innerHTML=''; return; }
  if (t.id === 'log-group' || t.id === 'log-flat') { logGroup = t.id==='log-group'; return render(); }
  if (d.close !== undefined && (e.target === t || t.tagName === 'BUTTON')) {
    palOpen = false; layer.innerHTML = ''; return;
  }
  if (d.confirmdel) { JOBS = JOBS.filter(j=>j.file!==d.confirmdel); layer.innerHTML=''; return go('jobs'); }
  if (d.deep) return modalDeep(d.deep);
  if (d.del) return modalDel(d.del);
  if (d.run) return modalRun(d.run, false);
  if (d.dry) return modalRun(d.dry, true);
  if (d.grp) { collapsed.has(d.grp) ? collapsed.delete(d.grp) : collapsed.add(d.grp); return renderChrome(); }
  if (d.grpopen) { groupFilter = d.grpopen; savedView = 'all'; return go('jobs'); }
  if (d.view) { savedView = d.view; groupFilter = null; statusF.clear(); return go('jobs'); }
  if (d.status) { statusF.has(d.status) ? statusF.delete(d.status) : statusF.add(d.status); return render(); }
  if (d.groupby) { groupBy = d.groupby; return render(); }
  if (d.clearf !== undefined) { statusF.clear(); q=''; groupFilter=null; savedView='all'; return render(); }
  if (d.bulk) {
    if (d.bulk === 'stagger') return modalStagger();
    if (d.bulk === 'clear') picked.clear();
    if (d.bulk === 'enable' || d.bulk === 'disable')
      JOBS.forEach(j => { if (picked.has(j.file)) j.enabled = d.bulk === 'enable'; });
    return render();
  }
  if (d.mode) { JOBS.find(x=>x.file===selected).schedule.mode = d.mode; return render(); }
  if (d.nav) { groupFilter = null; return go(d.nav); }
  if (d.job || d.open) { palOpen = false; layer.innerHTML=''; return go('detail', d.job || d.open); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.toggle) { JOBS.find(j=>j.file===el.dataset.toggle).enabled = el.checked; return render(); }
  if (el.dataset.pick) { el.checked ? picked.add(el.dataset.pick) : picked.delete(el.dataset.pick); return render(); }
  if (el.dataset.pickall !== undefined) {
    el.checked ? visible().forEach(j=>picked.add(j.file)) : picked.clear(); return render();
  }
  if (el.id === 'log-src') { logFilter = el.value; return render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'j-q') { q = el.value; render();
    const n = $('#j-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  if (el.id === 'log-q') { logQuery = el.value; render();
    const n = $('#log-q'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }
  if (el.id === 'pal-q') { palQ = el.value; renderPalette(); }
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); palOpen = true; palQ = ''; return renderPalette();
  }
  if (e.key === 'Escape') { palOpen = false; layer.innerHTML = ''; }
  if (e.key === 'Enter' && palOpen) {
    const first = document.querySelector('.pal-item');
    if (first) { palOpen = false; layer.innerHTML=''; go('detail', first.dataset.job); }
  }
});

render();
</script>
