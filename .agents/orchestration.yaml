# Machine-readable orchestration contract for MacOps.
# AGENTS.md is the constitution and takes precedence on anything not covered
# here. Hand-written: `og init` detects no toolchain because the Cargo project
# is nested under console/src-tauri rather than at the repo root.

branches:
  # GitFlow: branch from dev, PR back into dev. main is release-only.
  integration_base: dev
  protected: [main, dev]
  task_prefix: feature/

gates:
  # scope: worker -> runs in EACH implementer's worktree.
  # no scope      -> runs ONCE on the integration branch.

  - name: shell-syntax
    run: "bash -n bin/run && bash -n bin/run-job && bash -n lib/common.sh && bash -n install.sh && for j in tests/*.sh examples/jobs/*.sh tests/fixtures/jobs/*.sh; do bash -n \"$j\" || exit 1; done"
    scope: worker

  - name: shellcheck
    run: "shellcheck bin/run bin/run-job lib/common.sh install.sh examples/jobs/*.sh tests/*.sh tests/fixtures/jobs/*.sh"
    scope: worker

  # The five version surfaces (package.json, tauri.conf.json, Cargo.toml, both
  # lock files' root entries) must agree. Cargo.lock is resolved via `cargo
  # metadata --no-deps` and `cargo pkgid --locked`, both --offline: it needs
  # the Rust toolchain on PATH (and fails loudly without it), but no network
  # (--no-deps resolves no dependency graph, so no registry index is needed —
  # verified against an empty CARGO_HOME) and builds nothing, so it stays fast
  # (~0.4s). No pattern over Cargo.lock can work: a workspace member and a path
  # dependency have identical shape, so only cargo resolves the identity.
  - name: version-consistency
    run: "bash tests/version-consistency.sh"
    scope: worker

  - name: rust-check
    run: "cd console/src-tauri && cargo check --message-format=short"
    scope: worker

  - name: rust-test
    run: "cd console/src-tauri && cargo test --lib"
    scope: worker

  - name: frontend-typecheck
    run: "cd console && npm ci --silent && npx tsc --noEmit"
    scope: worker

  - name: frontend-test
    run: "cd console && npm ci --silent && npm run test"
    scope: worker

  # Integration-only: slower, and shares the npm/cargo cache.
  - name: frontend-build
    run: "cd console && npm run build"

  # Unscoped on purpose: the silent-contract gate asserts that a nominal run
  # prints NOTHING to stdout (AGENTS.md Principle I). It runs bin/run against
  # a SYNTHETIC automations root whose jobs are known-silent, in a temp dir,
  # with HOME redirected — it never touches the real logs, the real
  # ~/.mops, or any package manager. It still belongs to the integration
  # branch: it exercises the real dispatcher, so it must run once, against
  # the merged runner, not per worktree.
  - name: silent-contract
    run: "bash tests/silent-contract.sh"

never_write:
  - "logs/**"
  - "state/**"
  - "console/node_modules/**"
  - "console/dist/**"
  - "console/src-tauri/target/**"

merge_policy:
  # Every merge is a human decision until the gates have been watched on real
  # PRs. main and dev are protected above, so merge_gate DENYs into them.
  enabled: false
  auto_merge_target: dev
  max_diff_lines: 400
  max_diff_files: 15
  high_risk_paths:
    - "bin/**"                              # dispatcher and single-job runner
    - "lib/common.sh"                       # every job sources this
    - "install.sh"                          # writes to ~/Library/LaunchAgents
    - "launchagents/**"
    - "console/src-tauri/src/launchd.rs"    # generates what launchd loads
    - "console/src-tauri/src/jobs.rs"       # must agree with bin/run's parser
    - ".github/workflows/**"
  require_cross_vendor_review: true
